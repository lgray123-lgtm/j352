<!-- EXPANDED PHOTO VIEW -->

<div class="photo-lightbox" id="photoLightbox">

    <button class="photo-close" id="photoClose">
        &times;
    </button>

    <img id="largePhoto" src="" alt="Expanded photograph">

</div>


<!-- PHOTO VIEWER JAVASCRIPT -->

<script>

const galleryPhotos = document.querySelectorAll(".photo-grid img");

const photoLightbox = document.getElementById("photoLightbox");

const largePhoto = document.getElementById("largePhoto");

const photoClose = document.getElementById("photoClose");


// OPEN PHOTO

galleryPhotos.forEach(photo => {

    photo.addEventListener("click", () => {

        largePhoto.src = photo.src;

        largePhoto.alt = photo.alt;

        photoLightbox.classList.add("active");

    });

});


// CLOSE PHOTO

function closePhoto() {
    photoLightbox.classList.remove("active");
}

photoClose.addEventListener("click", closePhoto);


// CLICK OUTSIDE PHOTO TO CLOSE

photoLightbox.addEventListener("click", (event) => {

    if (event.target === photoLightbox) {
        closePhoto();
    }

});


// ESCAPE KEY

document.addEventListener("keydown", (event) => {

    if (event.key === "Escape") {
        closePhoto();
    }

});

</script>
